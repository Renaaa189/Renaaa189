<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">

<style>
  .star {
    animation: pulse 4s ease-in-out infinite;
  }

  .line {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: connect 6s ease-in-out infinite;
  }

  @keyframes connect {
    0% {
      stroke-dashoffset: 200;
      opacity: 0;
    }
    30% {
      opacity: .5;
    }
    100% {
      stroke-dashoffset: 0;
      opacity: .5;
    }
  }

  @keyframes pulse {
    0%,100% {
      opacity: .4;
    }
    50% {
      opacity: 1;
    }
  }

  .float {
    animation: float 12s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% {
      transform: translateY(0px);
    }
    50% {
      transform: translateY(-12px);
    }
  }
</style>

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="50%" stop-color="#08142B"/>
  <stop offset="100%" stop-color="#0F2350"/>
</linearGradient>

<linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#5EA8FF" stop-opacity="0.15"/>
  <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
  <stop offset="100%" stop-color="#5EA8FF" stop-opacity="0.15"/>
</linearGradient>

</defs>

<rect width="1600" height="500" fill="url(#bg)"/>

<!-- CONSTELLATIONS -->
<g class="float">

  <line class="line" x1="180" y1="120" x2="320" y2="180" stroke="#8EC5FF" stroke-width="1.3"/>
  <line class="line" x1="320" y1="180" x2="470" y2="110" stroke="#8EC5FF" stroke-width="1.3"/>
  <line class="line" x1="470" y1="110" x2="620" y2="160" stroke="#8EC5FF" stroke-width="1.3"/>

  <line class="line" x1="760" y1="100" x2="900" y2="170" stroke="#9FCBFF" stroke-width="1.3"/>
  <line class="line" x1="900" y1="170" x2="1080" y2="120" stroke="#9FCBFF" stroke-width="1.3"/>

  <line class="line" x1="1180" y1="150" x2="1320" y2="90" stroke="#B4CBFF" stroke-width="1.3"/>
  <line class="line" x1="1320" y1="90" x2="1460" y2="170" stroke="#B4CBFF" stroke-width="1.3"/>

  <!-- STARS -->
  <circle class="star" cx="180" cy="120" r="3" fill="white"/>
  <circle class="star" cx="320" cy="180" r="4" fill="white"/>
  <circle class="star" cx="470" cy="110" r="3" fill="white"/>
  <circle class="star" cx="620" cy="160" r="3.5" fill="white"/>

  <circle class="star" cx="760" cy="100" r="3" fill="white"/>
  <circle class="star" cx="900" cy="170" r="4" fill="white"/>
  <circle class="star" cx="1080" cy="120" r="3.5" fill="white"/>

  <circle class="star" cx="1180" cy="150" r="3"/>
  <circle class="star" cx="1320" cy="90" r="4"/>
  <circle class="star" cx="1460" cy="170" r="3"/>

</g>

<!-- TEXT -->
<g text-anchor="middle">

  <text
    x="800"
    y="255"
    fill="white"
    font-size="74"
    font-family="Inter, Arial"
    font-weight="700"
    letter-spacing="-2">

    Renata Gallucci

  </text>

  <text
    x="800"
    y="305"
    fill="#AAB8DF"
    font-size="26"
    font-family="Inter, Arial"
    letter-spacing="1.5">

    Estudiante de Computación - Desarrollo Full-Stack

  </text>

</g>

<!-- WAVES -->
<path d="M0 400C240 340 420 450 640 400C870 350 1080 320 1320 390C1480 430 1550 410 1600 360V500H0Z"
      fill="url(#wave)">

  <animate attributeName="d"
           dur="10s"
           repeatCount="indefinite"
           values="
           M0 400C240 340 420 450 640 400C870 350 1080 320 1320 390C1480 430 1550 410 1600 360V500H0Z;
           M0 380C260 460 480 350 720 390C960 440 1180 320 1420 380C1510 400 1570 390 1600 340V500H0Z;
           M0 400C240 340 420 450 640 400C870 350 1080 320 1320 390C1480 430 1550 410 1600 360V500H0Z"/>
</path>

</svg>
